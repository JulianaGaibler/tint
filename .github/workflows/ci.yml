name: CI

on:
  workflow_call:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run check
      - run: npx vitest run --project=unit
      # Builds dist and runs publint on the package.
      - run: npm run package
      - run: npm run build-storybook
